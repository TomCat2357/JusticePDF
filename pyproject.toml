[project]
name = "justicepdf"
version = "0.1.0"
description = "JustinPDF - Visual PDF merge/split application."
requires-python = ">=3.14,<3.15"
dependencies = [
    "PyQt6==6.11.0",
    "PyMuPDF==1.27.2.3",
    "watchdog==6.0.0",
    "Send2Trash==2.1.0",
    "pytest==9.0.2",
    "pytest-qt==4.5.0",
    "pywin32==312; platform_system == 'Windows'",
    # 個人情報(PII)検出エンジン(src/pii、PresidioPDFから移植)が使用する依存。
    # 形態素解析ベースのPII検出(sudachipy)と日本の電話番号妥当性検証(phonenumbers)。
    "sudachipy>=0.6.11",
    "sudachidict-core>=20240409",
    "phonenumbers>=8.13.0",
    "lxml>=6.1.3",
    "python-pptx",
]

[project.optional-dependencies]
# OCR(RapidOCR v3)。テキストレイヤの無いページ(スキャン画像等)を対象に、
# 個人情報検出用のテキスト・座標を補完する任意機能。未導入でもアプリは
# 通常起動し、PII検出ドロワーのOCRオプションが無効表示になるだけ。
ocr = [
    "rapidocr>=3.8.1",
    "onnxruntime>=1.22.0",
    # src/ocr/base.py が画像の白塗り(既存テキスト部分の消去)に使う。
    "Pillow>=10.0.0",
]

# SudachiPyの辞書(既定のcoreはdependenciesに含まれる)。small/fullも`all`(下記)で入る。
# 未導入のまま選択するとcoreへフォールバックする(fullは数百MB)。
sudachi-small = ["sudachidict-small>=20240409"]
sudachi-full = ["sudachidict-full>=20240409"]

# 全部入り: OCR + Sudachi辞書(small/core/full)。pip/install2.ps1は `.[all]` を使う。
# OCRの高精度(server)モデルは別途 `python -m src.ocr.download_models` で取得する。
all = ["justicepdf[ocr,sudachi-small,sudachi-full]"]

# uvは既定でextraを入れないため、素の `uv sync` で全部入るようグループ経由で`all`を取り込む。
[dependency-groups]
full = ["justicepdf[all]"]

[tool.uv]
default-groups = ["full"]

[build-system]
requires = ["setuptools==80.10.2", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"
