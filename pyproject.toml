[project]
name = "justicepdf"
version = "0.1.0"
description = "JustinPDF - Visual PDF merge/split application."
requires-python = ">=3.14,<3.15"
dependencies = [
    "PyQt6==6.11.0",
    "PyMuPDF==1.27.2.3",
    "watchdog==6.0.0",
    "Send2Trash==2.1.0",
    "pytest==9.0.2",
    "pytest-qt==4.5.0",
    "pywin32==312; platform_system == 'Windows'",
    # 個人情報(PII)検出エンジン(src/pii、PresidioPDFから移植)が使用する依存。
    # 形態素解析ベースのPII検出(sudachipy)と日本の電話番号妥当性検証(phonenumbers)。
    # PresidioPDF自身の指定(`sudachipy>=0.6.11`、上限無し)に合わせる。
    # 以前GiNZA(ja-ginza/ginza、`sudachipy<0.7.0`を要求)を必須依存にしていた際は
    # 上限を明示していたが、GiNZA/spaCy/Janomeは撤去した(理由は
    # src/pii/engines.py のモジュールdocstring参照: PresidioPDF自身も
    # Python 3.14移行時にspaCy/GiNZAを撤去してSudachiPyへ一本化しており、
    # 2026-09時点でも`import spacy`自体がPython 3.14 + pydanticの非互換で
    # 失敗する既知の上流未修正バグを実機確認したため)。
    "sudachipy>=0.6.11",
    # Sudachi辞書は core(既定)に加え、設定ダイアログの「Sudachi 辞書 / 分割
    # モード」(PresidioPDFの同名設定を移植)で full/small も選べるようにする。
    # sudachidict-full は本体がPyPIにwheelを持たず、sdistのsetup.pyが
    # 独自URLから辞書データ(数百MB)を直接ダウンロードするビルド時挙動になって
    # おり(`pip install sudachidict-full`を実機で試すと、そのURLがネットワーク
    # 制限環境では到達不能で失敗することを確認した)、通常のPyPIミラー経由の
    # インストールでは完結しないため、必須依存には含めない
    # (設定では選択可能にするが、未導入なら検出時にエラーメッセージで案内する)。
    # sudachidict-small は通常のwheel配布(約40MB)のため必須依存にできる。
    "sudachidict-core>=20240409",
    "sudachidict-small>=20240409",
    "phonenumbers>=8.13.0",
    # OCR(RapidOCR v3)。テキストレイヤの無いページ(スキャン画像等)を対象に、
    # 個人情報検出用のテキスト・座標を補完する。個人情報の見落としを防ぐため、
    # (PresidioPDFでは任意extraだが)JusticePDFでは必須依存として同梱する。
    "rapidocr>=3.8.1",
    "onnxruntime>=1.22.0",
]

[build-system]
requires = ["setuptools==80.10.2", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"
